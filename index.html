<!doctype html>
<html lang="en" data-motion="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="OpenPackets: a self-study companion for the Cisco CCNA 200-301 exam, with lessons, labs, practice questions, flashcards and trainers." />
    <title>OpenPackets</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/archivo-normal-400-700-latin-v25.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/big-shoulders-display-normal-700-900-latin-v24.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("ccna.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        var m = localStorage.getItem("ccna.motion");
        if (m === "reduced" || m === "full") document.documentElement.setAttribute("data-motion", m);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
