name: Publish OpenPackets

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Publishing is its own job on purpose. GitHub's artifact list can lag a few
  # seconds behind an upload, and deploy-pages fails with "No artifacts named
  # github-pages" if it looks straight away (actions/deploy-pages#451). A
  # separate job starts later, and "Re-run failed jobs" then repeats only the
  # publish instead of uploading a second artifact.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url || steps.publish_retry.outputs.page_url }}

    steps:
      - name: Publish website
        id: publish
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait for the artifact to be listed
        if: steps.publish.outcome == 'failure'
        run: sleep 30

      - name: Publish website (second attempt)
        id: publish_retry
        if: steps.publish.outcome == 'failure'
        uses: actions/deploy-pages@v5
